project:
  name: BEEDSTITCHES Fashion Website
  client_name: Iwunna Uchenna Michael
  brand_name: BEEDSTITCHES Fashion
  project_type: Premium fashion portfolio + consultation/booking website
  primary_goal: Showcase authentic work and convert visitors into tailoring consultation and booking enquiries.
  secondary_goal: Present the founder as a fashion designer, creative director, garment-production professional, and fashion
    educator.
  scope:
    portfolio: true
    booking_requests: true
    whatsapp_contact: true
    fashion_training_leads: true
    ecommerce: false
  non_goals:
  - Do not build a full e-commerce checkout in phase 1.
  - Do not invent prices, testimonials, awards, certification details, or client names.
  - Do not copy reference websites directly.
brand:
  logo_asset:
    filename: WhatsApp Image 2026-10-24 at 8.05.02 AM.jpeg
    note: Use this client-supplied logo for the first build; replace with transparent/vector version if later provided.
  color_system:
    black: '#0B0B0B'
    charcoal: '#191919'
    gold: '#D4AF37'
    gold_highlight: '#F2C94C'
    off_white: '#F7F4EE'
    white: '#FFFFFF'
    muted_text: '#B9B1A4'
  direction:
  - Respect the client's existing black-and-gold identity.
  - Use gold as an accent, not as the dominant background everywhere.
  - Keep the experience luxurious, editorial, masculine, refined, and minimal.
  - Use generous whitespace and large fashion imagery.
  - Avoid gaudy gradients, excessive glow, clutter, and cheap luxury effects.
  typography:
    headings: Elegant editorial serif or refined fashion display font.
    body: Clean modern sans-serif with excellent mobile readability.
  inspiration:
    visual: Andrew Brookes Tailoring
    functional: The Bespoke Tailor
    interpretation:
    - Use premium simplicity, large imagery, whitespace, and restrained typography for the visual language.
    - Use strong portfolio discovery and a clear consultation/appointment request flow for functionality.
    - Do not clone either reference site.
