      verified.
  about:
    title: About BEEDSTITCHES
    sections:
    - Brand Story
    - Design Philosophy
    - Meet the Founder
    - 8+ Years of Craftsmanship
    - Fashion Education & Mentorship
    - Quality & Production Standards
    copy_rules:
    - Condense the supplied biography and resume into customer-facing copy.
    - Do not paste the resume verbatim.
