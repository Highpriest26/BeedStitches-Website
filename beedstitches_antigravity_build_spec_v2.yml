    title: Book a Consultation
    intro: Tell us what you want to create. We will review your request and contact you to confirm the next step.
    mode: request_based_manual_confirmation
    fields:
    - key: full_name
      label: Full Name
      type: text
      required: true
    - key: phone
      label: Phone / WhatsApp
      type: tel
      required: true
    - key: email
      label: Email
      type: email
      required: false
    - key: location
      label: Your Location
      type: text
      required: true
    - key: service
      label: What would you like us to make?
      type: select
      required: true
      options:
      - Kaftan / Native Wear
      - Jalabia / Traditional Wear
      - Two-Piece Outfit
      - Shirt / Contemporary Menswear
      - Casual / Streetwear
      - Cultural / Heritage Outfit
      - Corporate / Smart Casual
      - Custom Design
      - Garment Production
      - Fashion Training
      - Other
    - key: consultation_type
      label: Consultation Type
      type: select
      required: true
      options:
      - In-person in Enugu
      - Phone / WhatsApp
      - Video consultation
      - Remote / International order
    - key: occasion
      label: What is the outfit for?
      type: text
      required: false
    - key: event_date
      label: Event / Needed By Date
      type: date
      required: false
    - key: preferred_date
      label: Preferred Consultation Date
      type: date
      required: true
    - key: preferred_time
      label: Preferred Time
      type: time
      required: false
    - key: reference_image
      label: Upload Inspiration / Reference
      type: file
      required: false
      accept:
      - image/jpeg
      - image/png
      - image/webp
    - key: message
      label: Tell us about the outfit
      type: textarea
      required: false
    success:
      heading: Request Received
      message: Thank you. BEEDSTITCHES will review your request and contact you to confirm your consultation.
