content:
  founder_summary: Iwunna Uchenna Michael is the Founder and Creative Director of BEEDSTITCHES Fashion, a Nigerian fashion
    house focused on quality craftsmanship, contemporary African menswear, garment production and practical fashion education.
  experience_summary: With more than eight years of hands-on experience, BEEDSTITCHES brings practical knowledge across concept
    development, fabric selection, cutting, garment construction, finishing, quality control and client delivery.
  remote_summary: BEEDSTITCHES also works with remote and international clients, translating visual references and individual
    style preferences into carefully constructed custom garments.
  philosophy_summary: We transform ideas and fabrics into garments that reflect the personality of the wearer, with careful
    attention to fabric, cut, construction, finishing, comfort and confidence.
assets:
  available:
    logo:
      filename: WhatsApp Image 2026-10-24 at 8.05.02 AM.jpeg
  required_before_final_launch:
  - 15-30 strongest portfolio images organized by category.
  - 2-5 strong photos of the founder/designer.
  - Customer testimonials if available.
  - Exact social profile URLs.
  - Confirmed valid email address.
  - 'Booking availability: days and working hours.'
  - Whether consultations are free or paid.
  - Any cancellation, deposit, production-time, and delivery policy to publish.
  - Exact fashion-educator certification issuer/title/date if it will be publicly displayed.
  image_rules:
  - Use client-supplied imagery as the primary visual content.
  - Optimize to WebP/AVIF where appropriate.
  - Use meaningful alt text.
  - Keep portfolio grid aspect ratios consistent.
  - Do not aggressively upscale poor-quality images.
ux:
  principles:
  - Photography first.
  - One clear primary CTA per section.
  - Mobile-first.
  - Premium but uncomplicated.
  - Short paragraphs and strong hierarchy.
  - Low-friction booking.
  mobile:
  - Use a compact sticky header or bottom CTA with Book and WhatsApp actions.
  - Make portfolio interactions touch-friendly.
  - Use large form controls and tap targets.
  motion:
    allowed:
    - Soft image reveals
    - Gentle fade/slide on scroll
    - Minimal hover transitions
    avoid:
    - Heavy parallax
    - Excessive motion
    - Flashy gold animation
    - Anything that delays content access
seo:
  default_title: BEEDSTITCHES Fashion | Bespoke Tailoring & African Menswear in Enugu
  default_description: BEEDSTITCHES Fashion creates bespoke kaftans, native wear, jalabias, two-piece outfits, contemporary
    African menswear and custom garments in Enugu, Nigeria.
  target_topics:
  - Bespoke tailor Enugu
  - Fashion designer Enugu
  - Men's native wear Enugu
  - Kaftan designer Nigeria
  - Custom menswear Nigeria
  - African menswear designer
  - Tailoring training Enugu
  requirements:
  - Unique metadata per page.
  - Open Graph metadata.
  - Sitemap.xml and robots.txt.
  - Semantic headings.
  - Descriptive alt text.
  - Appropriate structured data only where factually accurate.
  - No keyword stuffing.
technical:
  recommended_stack:
    framework: Next.js App Router
    language: TypeScript
    styling: Tailwind CSS
    motion: Framer Motion only where useful
    deployment: Vercel-compatible
  architecture:
  - Reusable components and sections.
  - Portfolio and services data separated from UI so a CMS can be added later.
  - Booking submission logic isolated from presentation.
  - Keep business content editable in simple data/config files.
  future_ready:
  - CMS integration
  - Customer accounts
  - Online deposits/payments
  - Ready-to-wear e-commerce
  - Measurement profiles
  - Order tracking
  quality:
  - No TypeScript errors.
  - No broken links.
  - Responsive from 320px upward.
  - Keyboard accessible.
  - Visible focus states.
  - Good color contrast.
  - Performance-oriented image loading.
  - Avoid layout shift.
antigravity:
  instruction: Build a production-quality website, not a static mockup.
  rules:
  - Treat this YAML as the source of truth.
  - Do not invent missing client facts.
  - Do not create fake testimonials, portfolio work, prices, certifications, or institutions.
  - Use the supplied black-and-gold identity.
  - Keep the site elegant, editorial, and minimal.
  - Temporary development placeholders must be clearly isolated and easy to replace.
  - Every CTA must lead somewhere functional.
  - The Book Consultation form must work end-to-end.
  - WhatsApp CTAs must use +2348132884507.
  - Remote and international clients must be acknowledged.
  - No e-commerce checkout in phase 1.
  acceptance:
  - Home page communicates the brand clearly above the fold.
  - Portfolio is visually dominant and easy to filter.
  - Services are clear and concise.
  - Founder credibility is visible without dumping the full resume.
  - Fashion training has a separate enquiry path.
  - Booking flow is easy on mobile.
  - No invented business facts appear anywhere.
