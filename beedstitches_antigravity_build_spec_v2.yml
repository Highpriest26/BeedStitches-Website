  fashion_training:
    title: Fashion Training
    hero_heading: Learn Fashion Through Practice
    intro: Practical training and mentorship in fabric selection, cutting, garment construction, stitching, finishing and
      professional presentation.
    proof_points:
    - Certified Fashion Educator
    - 8+ years of practical fashion experience
    - At least 15 students and apprentices trained
    curriculum:
    - Fabric sourcing and selection
    - Garment cutting
    - Stitching and construction
    - Finishing and attention to detail
