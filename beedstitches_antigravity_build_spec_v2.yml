      eyebrow: BEEDSTITCHES FASHION
      headline: Crafted With Precision. Designed To Be Remembered.
      subheadline: Bespoke African menswear, luxury native wear and contemporary garments created with intention, comfort
        and refined finishing.
      primary_cta: Book a Consultation
      secondary_cta: View Our Work
      design: Full-bleed fashion image, restrained dark overlay, minimal copy.
    - type: featured_portfolio
      heading: Selected Work
      description: A curated selection of BEEDSTITCHES garments.
      cta: Explore Portfolio
    - type: brand_statement
      heading: More Than Clothing
      body: At BEEDSTITCHES, fashion is a combination of art, identity, craftsmanship, comfort and precision.
    - type: services_preview
      heading: What We Create
      max_categories: 6
      cta: Explore Services
    - type: process
      heading: From Idea to Finished Garment
      steps:
      - Tell Us What You Need
      - Consultation & Measurements
      - Craft & Finish
      - Fitting & Delivery
    - type: founder
      heading: Meet the Designer
      body: Iwunna Uchenna Michael is the Founder and Creative Director of BEEDSTITCHES, with over eight years of practical
        experience in bespoke tailoring, garment construction, production supervision and fashion education.
      cta: About Michael
    - type: training
      heading: Learn the Craft
      body: Practical fashion education and mentorship for aspiring tailors and garment makers.
      cta: Explore Fashion Training
    - type: final_cta
      heading: Ready To Create Something Made For You?
      body: Start with a consultation and tell us what you have in mind.
      primary_cta: Book Consultation
      secondary_cta: Chat on WhatsApp
  portfolio:
